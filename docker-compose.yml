services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports: ["5432:5432"]
    volumes: ["keystone_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/keystone
      DB_USERNAME: keystone
      DB_PASSWORD: keystone
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploying-please-use-64-chars}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost
    ports: ["8080:8080"]
    volumes: ["keystone_uploads:/app/uploads"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["80:80"]
volumes:
  keystone_pg:
  keystone_uploads:
