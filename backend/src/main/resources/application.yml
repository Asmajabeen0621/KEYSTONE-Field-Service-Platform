
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/keystone
    username: keystone
    password: keystone

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: dev-only-change-me-please-use-a-very-long-random-secret-key
    expiration-minutes: 120

  uploads-dir: ./uploads

  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,https://keystone-field-service-platform-1.onrender.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /v3/api-docs
